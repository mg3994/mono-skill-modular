name: workspace
description: Workspace root for BlogStore suite.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

workspace:
  - apps/blogstore
  - packages/core
  - packages/domain
  - packages/infrastructure
  - packages/l10n

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  build: ^4.0.0
  build_runner: ^2.4.13
  build_web_compilers: ^4.0.10
  drift: ^2.24.0
  flutter_lints: ^6.0.0

flutter:
  generate: true
